# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: casino-royale
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
